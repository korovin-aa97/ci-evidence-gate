name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ""
      - name: Unit and fixture tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -v
      - name: Three-verdict demo
        env:
          PYTHONPATH: src
        run: python3 scripts/run_demo.py
      - name: Compile source
        run: python3 -m compileall -q src tests scripts

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color
      - name: Validate release invariants
        run: python3 scripts/validate_release.py

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Ruff lint and format
        run: |
          uvx --from ruff==0.16.5 ruff check .
          uvx --from ruff==0.16.5 ruff format --check .
      - name: Strict type check
        run: uvx --from mypy==2.3.1 mypy --strict src
      - name: Security scan
        run: uvx --from bandit==1.9.4 bandit -q -r src scripts -x tests

  evidence:
    if: ${{ github.event_name == 'pull_request' && always() }}
    needs: [test, lint, quality]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Evaluate this repository
        uses: ./
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
