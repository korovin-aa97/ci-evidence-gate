schema = "ci-evidence-manifest/v1"

[policy]
max_evidence_age_hours = 24
protected = [
  ".github/workflows/ci.yml",
  "action.yml",
  "src/**",
  "tests/**",
  "scripts/**",
  "schemas/**",
]

[[checks]]
id = "test"
name = "test"
workflow = ".github/workflows/ci.yml"
app_slug = "github-actions"
allowed_conclusions = ["success"]
events = ["pull_request"]

[[checks]]
id = "lint"
name = "lint"
workflow = ".github/workflows/ci.yml"
app_slug = "github-actions"
allowed_conclusions = ["success"]
events = ["pull_request"]

[[surfaces]]
name = "repository"
patterns = ["**"]
checks = ["test", "lint"]
